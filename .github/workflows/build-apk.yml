name: Build SAQR GYM APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android .

      - name: Relax Kotlin/Java JVM target validation
        run: echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      - name: Enable core library desugaring
        run: |
          cat >> android/app/build.gradle.kts << 'EOF'

          android {
              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saqr-gym-apk
          path: build/app/outputs/flutter-apk/app-release.apk
