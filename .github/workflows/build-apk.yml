name: Build SAQR GYM APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # تثبيت نسخة Flutter بالظبط بدل "stable" المتغيرة - يمنع مفاجآت
      # من تحديثات Flutter المستقبلية اللي ممكن تكسر البيلد فجأة
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android .

      - name: Patch Android build settings (كل الاحتياطات المعروفة)
        run: |
          # 1) توحيد نسخة Java/Kotlin - يمنع Inconsistent JVM Target
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

          # 2) زيادة ذاكرة Gradle - يمنع Out Of Memory وقت البناء
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g" >> android/gradle.properties

          # 3) تفعيل AndroidX/Jetifier - مطلوب لمعظم البلجنز الحديثة
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

          # 4) رفع compileSdk لأعلى رقم متاح + تثبيت NDK اللي كل البلجنز بتطلبه فعليًا
          #    (28.2.13676358 - ده اللي ظاهر في رسالة الخطأ إن file_picker وغيره محتاجينه،
          #    مش 27 زي ما كان متظبط قبل كده)
          # 5) تفعيل core library desugaring - مطلوب للـ notifications وغيرها
          # 6) تفعيل multidex - يمنع "method count exceeded" لو التطبيق كبر
          cat >> android/app/build.gradle.kts << 'EOF'

          android {
              compileSdk = 36
              ndkVersion = "28.2.13676358"

              defaultConfig {
                  multiDexEnabled = true
              }

              compileOptions {
                  isCoreLibraryDesugaringEnabled = true
              }
          }

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
              implementation("androidx.multidex:multidex:2.0.1")
          }
          EOF

      - name: توحيد Android SDK لكل المكتبات (plugins) مع بعض - الحل الجذري
        run: |
          # المشكلة إن كل plugin (file_picker وغيره) بياخد رقم compileSdk
          # الافتراضي من فلاتر نفسه (34)، مش من إعدادات تطبيقك.
          # التعديل اللي عملناه في app/build.gradle.kts بيأثر على تطبيقك بس.
          # السطور دي بتجبر كل المكتبات جوه المشروع (subprojects) إنها
          # تستخدم نفس رقم الـ SDK والـ NDK، فمفيش أي مكتبة تفضل عالقة
          # على رقم قديم - سواء دلوقتي أو مع أي تحديث مستقبلي.
          cat >> android/build.gradle.kts << 'EOF'

          subprojects {
              afterEvaluate {
                  extensions.findByType(com.android.build.gradle.BaseExtension::class.java)?.apply {
                      compileSdkVersion(36)
                      ndkVersion = "28.2.13676358"
                  }
              }
          }
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      # مايفشلش الـ build بسبب ملاحظات info/warning تجميلية
      - name: Analyze (non-blocking)
        run: flutter analyze || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: saqr-gym-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # لو فشل أي حاجة تانية، نرفع اللوجز عشان تبصلها بسهولة من غير
      # ما تدور في الـ Actions tab
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/*.log
          if-no-files-found: ignore
